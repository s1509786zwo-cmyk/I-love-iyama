<!doctype html><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">
import * as T from 'three';import {DRACOLoader}from'three/addons/loaders/DRACOLoader.js';import {GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const renderer=new T.WebGLRenderer({antialias:false});renderer.setSize(800,600);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NoToneMapping;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color(0x17212b);scene.add(new T.HemisphereLight(0xffffff,0x777777,2));const camera=new T.PerspectiveCamera(80,800/600,.03,150);window.ready=false;const draco=new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');const root=(await new GLTFLoader().setDRACOLoader(draco).loadAsync('./assets/'+new URLSearchParams(location.search).get('map')+'.glb')).scene;scene.add(root);root.updateMatrixWorld(true);const box=new T.Box3().setFromObject(root);window.box={min:box.min.toArray(),max:box.max.toArray()};window.render=(pos,look)=>{camera.position.fromArray(pos);camera.lookAt(...look);renderer.render(scene,camera)};window.probe=(x,z,y=20)=>{const ray=new T.Raycaster(new T.Vector3(x,y,z),new T.Vector3(0,-1,0),0,50);return ray.intersectObject(root,true).map(h=>({p:h.point.toArray(),n:h.face.normal.clone().transformDirection(h.object.matrixWorld).toArray(),obj:h.object.name})).filter(h=>h.n[1]>.4)};window.pick=(x,y)=>{const ray=new T.Raycaster();ray.setFromCamera(new T.Vector2(x/800*2-1,1-y/600*2),camera);return ray.intersectObject(root,true).slice(0,3).map(h=>({p:h.point.toArray(),n:h.face.normal.clone().transformDirection(h.object.matrixWorld).toArray(),obj:h.object.name}));};window.ready=true;draco.dispose();
</script>
